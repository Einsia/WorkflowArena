schema_version = "1.4"
artifacts = ["/workspace/submission"]

[task]
name = "WFA-SCI-005"
version = "0.1.0"
description = "Predict NMR scalar coupling constants for about 2.5 million intramolecular atom pairs"

[metadata]
domain = "SCI"
subcategory = "SCI-PRED"
evaluation_mode = "harbor_native"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 3600
cpus = 16
memory_mb = 65536
storage_mb = 40960
network_mode = "no-network"
workdir = "/workspace"

[verifier]
timeout_sec = 1200
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
cpus = 2
memory_mb = 8192
storage_mb = 4096
