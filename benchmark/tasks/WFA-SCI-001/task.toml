schema_version = "1.4"
artifacts = ["/workspace/submission"]

[task]
name = "WFA-SCI-001"
version = "0.1.0"
description = "Select and rank the top 10 most likely correct models for each of 10 targets from ~18,000 docking decoys"

[metadata]
domain = "SCI"
subcategory = "SCI-PRED"
evaluation_mode = "harbor_native"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 7200
cpus = 16
memory_mb = 32768
storage_mb = 61440
network_mode = "no-network"
workdir = "/workspace"

[verifier]
timeout_sec = 900
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
cpus = 2
memory_mb = 4096
storage_mb = 2048
