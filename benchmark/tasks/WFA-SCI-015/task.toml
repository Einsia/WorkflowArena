schema_version = "1.4"
artifacts = ["/workspace/submission"]

[task]
name = "WFA-SCI-015"
version = "0.1.0"
description = "Practical issues in real-time estimation of the effective reproduction number R_t: method comparison, generation-interval misspecification, smoothing windows and reporting delays (paper reproduction)"

[metadata]
domain = "SCI"
subcategory = "SCI-REPRO"
evaluation_mode = "harbor_native"

[agent]
timeout_sec = 14400
