schema_version = "1.4"
artifacts = ["/workspace/submission"]

[task]
name = "WFA-SCI-002"
version = "0.1.0"
description = "Estimate global and interface quality scores for 3410 candidate models of 12 protein complex targets"

[metadata]
domain = "SCI"
subcategory = "SCI-PRED"
evaluation_mode = "harbor_native"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 3600
cpus = 16
memory_mb = 32768
storage_mb = 40960
