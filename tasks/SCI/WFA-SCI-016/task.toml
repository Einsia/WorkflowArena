schema_version = "1.4"
artifacts = ["/workspace/submission"]

[task]
name = "WFA-SCI-016"
version = "0.1.0"
description = "High-dimensional geometry of population responses of ~10,000 neurons in mouse primary visual cortex: cross-validated PCA spectra and power-law exponents (paper reproduction)"

[metadata]
domain = "SCI"
subcategory = "SCI-REPRO"
evaluation_mode = "harbor_native"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 21600
cpus = 16
memory_mb = 65536
storage_mb = 40960
network_mode = "no-network"
workdir = "/workspace"

[verifier]
timeout_sec = 600
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
cpus = 1
memory_mb = 2048
storage_mb = 2048
