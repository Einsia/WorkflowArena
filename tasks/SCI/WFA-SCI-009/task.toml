schema_version = "1.4"
artifacts = ["/workspace/submission"]

[task]
name = "WFA-SCI-009"
version = "0.1.0"
description = "Equation-of-state precision verification with plane-wave pseudopotential DFT: 10 crystals"

[metadata]
domain = "SCI"
subcategory = "SCI-REPRO"
evaluation_mode = "harbor_native"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 3600
cpus = 32
memory_mb = 32768
storage_mb = 20480
network_mode = "no-network"
workdir = "/workspace"

[verifier]
timeout_sec = 600
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
cpus = 1
memory_mb = 2048
storage_mb = 2048
