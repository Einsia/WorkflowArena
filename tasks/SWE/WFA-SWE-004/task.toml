schema_version = "1.4"
artifacts = ["/workspace/pyscf"]

[task]
name = "WFA-SWE-004"
version = "0.1.0"
description = "Extend PySCF molecular GW: exact density-fitted G0W0, contour-deformation GW, evGW and qsGW (R/U)"

[metadata]
domain = "SWE"
subcategory = "SWE-FEAT"
evaluation_mode = "harbor_native"

[agent]
timeout_sec = 14400
