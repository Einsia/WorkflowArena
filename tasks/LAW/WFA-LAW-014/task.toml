schema_version = "1.4"
artifacts = ["/workspace/submission", "/workspace/work"]

[task]
name = "WFA-LAW-014"
version = "0.2.0"
description = "Adjudicate a 8-defendant criminal case from Chinese evidence excerpts using a closed legal corpus."

[metadata]
domain = "LAW"
subcategory = "LAW-ADJ"
evaluation_mode = "harbor_native"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 4096
storage_mb = 4096
network_mode = "no-network"
workdir = "/workspace"

[verifier]
timeout_sec = 600
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
cpus = 1
memory_mb = 2048
storage_mb = 2048
