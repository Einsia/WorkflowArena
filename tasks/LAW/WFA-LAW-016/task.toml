schema_version = "1.4"
artifacts = ["/workspace/submission"]

[task]
name = "WFA-LAW-016"
version = "0.1.0"
description = "Adjudicate a 12-defendant Chinese criminal case (first instance, 2018) from the court's fact findings: per-defendant charges, articles, principal/accessory roles, ringleaders, statutory circumstances, sentences and probation (inputs and answer vocabulary in Chinese)"

[metadata]
domain = "LAW"
subcategory = "LAW-ADJ"
evaluation_mode = "harbor_native"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 3600
cpus = 4
memory_mb = 8192
storage_mb = 4096
network_mode = "no-network"
workdir = "/workspace"

[verifier]
timeout_sec = 600
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
cpus = 1
memory_mb = 2048
storage_mb = 2048
